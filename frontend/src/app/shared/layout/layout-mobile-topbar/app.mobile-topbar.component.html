<ng-container *transloco="let t; prefix: 'layout'">
<header class="mobile-topbar">
  <div class="mobile-topbar-side mobile-topbar-side-start flex flex-1 items-center gap-0.5">
    <button
      type="button"
      class="mobile-topbar-button"
      [attr.aria-label]="t('menu.toggleNavigation')"
      (click)="layoutService.onMenuToggle()"
    >
      <svg lucideMenu aria-hidden="true"></svg>
    </button>
    @if (hasBack()) {
      <button
        type="button"
        class="mobile-topbar-button"
        [attr.aria-label]="backLabel() ? t('pageHeader.backTo', {label: backLabel()}) : ('common.back' | transloco)"
        (click)="goBack()"
      >
        <svg lucideArrowLeft aria-hidden="true"></svg>
      </button>
    }
  </div>
  <div class="mobile-topbar-center">
    <div class="mobile-topbar-brand" [class.is-faded]="showPageTitle()" [attr.aria-hidden]="showPageTitle() ? 'true' : null">
    <app-brand-mark class="mobile-topbar-brand-icon" />
    <span class="mobile-topbar-brand-text">Grimmory</span>
    </div>
    @if (pageTitle(); as title) {
      <div class="mobile-topbar-title" [class.is-visible]="showPageTitle()" [attr.aria-hidden]="showPageTitle() ? null : 'true'">
        <span class="mobile-topbar-title-text">{{ title }}</span>
      </div>
    }
  </div>
  <div class="mobile-topbar-side mobile-topbar-side-end flex flex-1 items-center justify-end gap-0.5">
    @if (commandPaletteService.isOpen()) {
      <button
        type="button"
        class="mobile-topbar-button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="closeSearch()"
      >
        <svg lucideX aria-hidden="true"></svg>
      </button>
    } @else {
      <button
        type="button"
        class="mobile-topbar-button"
        [attr.aria-label]="t('menu.search')"
        (click)="openSearch()"
      >
        <svg lucideSearch aria-hidden="true"></svg>
      </button>
    }
  </div>
</header>
</ng-container>
