<ng-container *transloco="let t; prefix: 'app'">
@if (loading()) {
  <div class="splash-screen">
    <div class="splash-content">
      <app-brand-mark class="logo" />
      @if (offline()) {
        <h1>{{ t('offline') }}</h1>
        <p>{{ t('offlineLoadingDescription') }}</p>
        <p>{{ t('offlineDescription') }}</p>
      } @else {
        <h1>{{ t('loading') }}</h1>
        <p>{{ t('loadingDescription') }}</p>
        <div class="loader"></div>
      }
    </div>
  </div>
} @else if (offline()) {
  <div class="splash-screen">
    <div class="splash-content">
      <app-brand-mark class="logo" />
      <h1>{{ t('offline') }}</h1>
      <p>{{ t('connectionLost') }}</p>
      <button class="retry-btn" (click)="reload()">{{ 'common.retry' | transloco }}</button>
    </div>
  </div>
} @else {
  <p-confirmDialog />
  <p-toast></p-toast>
  <app-command-palette />
  <router-outlet></router-outlet>
}
</ng-container>
